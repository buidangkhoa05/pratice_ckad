apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfg
  template:
    metadata:
      labels:
        app: cfg
    spec:
      volumes:
        - name: config
          configMap:
            name: app-config
      containers:
        - name: cfg
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: config
              mountPath: /etc/app

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
# stringData lets the API server do the base64 encoding. The equivalent
# imperative command is:
#   k create secret generic app-secret \
#     --from-literal=DB_USER=appuser --from-literal=DB_PASS=s3cr3t
stringData:
  DB_USER: appuser
  DB_PASS: s3cr3t

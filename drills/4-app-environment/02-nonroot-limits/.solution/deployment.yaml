apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure
  template:
    metadata:
      labels:
        app: secure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
          # nginx:1.27-alpine cannot satisfy runAsNonRoot: its entrypoint
          # binds port 80 and writes to root-owned paths. The unprivileged
          # build listens on 8080 as uid 101.
        - name: secure
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

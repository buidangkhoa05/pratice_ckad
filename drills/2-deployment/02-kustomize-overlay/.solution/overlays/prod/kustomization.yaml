apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: site
    count: 3
images:
  - name: nginx
    newTag: 1.28-alpine
# includeTemplates pushes env=prod onto the Pod template. The older
# commonLabels did this implicitly and also wrote into the selector, which is
# immutable and breaks on the second apply.
labels:
  - pairs:
      env: prod
    includeTemplates: true
